services:

  app:
    build:
      context: .
      dockerfile: dockerfile

    container_name: umbrela_api_container

    ports:
      - "8080:8080"

    env_file:
      - .env

    volumes:
      - ~/.m2:/root/.m2

    depends_on:
      - postgres
      - transformer

    networks:
      - spring-network

  # Worker Python (Whisper + Gemini) que gera as legendas normal/Libras.
  # Imagem separada para não inchar o container Java com torch/whisper.
  transformer:
    build:
      context: ./transformer
      dockerfile: Dockerfile

    container_name: umbrella_transformer

    env_file:
      - .env

    ports:
      # Exposto no host só para testes; o backend o acessa por http://transformer:8000
      - "8000:8000"

    networks:
      - spring-network

  postgres:
    image: postgres:16

    container_name: postgres-db

    restart: always

    environment:
      POSTGRES_DB: umbrella_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2309

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - spring-network

volumes:
  postgres_data:

networks:
  spring-network:



